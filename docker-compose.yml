services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidentiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: incidentiq_password
      POSTGRES_DB: incidentiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U incidentiq -d incidentiq" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: incidentiq-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  neo4j:
    image: neo4j:5.20-community
    container_name: incidentiq-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/incidentiq_password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: incidentiq-minio
    restart: unless-stopped
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data

  minio-wait:
    image: busybox:1.36
    depends_on:
      minio:
        condition: service_started
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        for i in $(seq 1 30); do
          if wget -q -O /dev/null http://minio:9000/minio/health/ready; then
            echo "MinIO is ready"
            exit 0
          fi
          sleep 2
        done
        echo "MinIO did not become ready within 60 seconds" >&2
        exit 1
    restart: "no"

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: incidentiq-minio-init
    depends_on:
      minio-wait:
        condition: service_completed_successfully
    environment:
      MC_HOST_myminio: http://minioadmin:minioadminpassword@minio:9000
    entrypoint: [ "/usr/bin/mc" ]
    command: [ "mb", "--ignore-existing", "myminio/incidentiq-artifacts" ]
    restart: "no"

volumes:
  postgres_data:
  kafka_data:
  neo4j_data:
  minio_data:
