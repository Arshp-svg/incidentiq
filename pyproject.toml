[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentiq"
version = "0.1.0"
description = "Evidence-Grounded AI Incident Investigation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "kafka-python-ng>=2.2.2",
    "neo4j>=5.18.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "mcp>=1.2.0,<2.0.0",
    "fastembed>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["incidentiq*", "services*"]
